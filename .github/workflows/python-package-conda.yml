name: Python Package using Conda

on:
  schedule:
    - cron: "30 0 * * *"
  push:
    branches:
      - master

jobs:
  build-linux:
    runs-on: ubuntu-latest   # 不再使用已退役的 ubuntu-20.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda with Python 3.8.16
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate: true          # 自动激活环境
          python-version: '3.8.16'     # 由 conda 直接提供，不依赖 setup-python 缓存
          # 可选：给环境起个名字，默认是 test，这里保持默认即可

      - name: Install dependencies
        shell: bash -el {0}             # 关键：以登录 shell 运行，确保 conda 已初始化
        run: |
          conda install pip
          pip install telethon

      - name: Lint with flake8
        shell: bash -el {0}
        run: |
          conda install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Checkin
        shell: bash -el {0}
        env:
          API_HASH: ${{ secrets.API_HASH }}
          API_ID: ${{ secrets.API_ID }}
        run: |
          python ./main.py
